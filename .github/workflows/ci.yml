name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: true
      NEXT_TELEMETRY_DISABLED: 1
      CI: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # - name: Generate Next types
      #   run: pnpm next build --no-lint
      #   env:
      #     NODE_ENV: production

      - name: Lint check
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:ci

  e2e:
    name: E2E (Cypress)
    needs: check
    runs-on: ubuntu-latest

    env:
      CI: true
      SKIP_ENV_VALIDATION: true
      NEXT_TELEMETRY_DISABLED: 1

      # Make NextAuth happy in CI
      NODE_ENV: test
      NEXTAUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: true
      NEXTAUTH_SECRET: testtesttesttest

      COORDINATOR_EMAILS: testcoordinator@wpi.edu

      # Prisma SQLite connection (file-backed)
      DATABASE_URL: file:./tmp/ci.db

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare SQLite dir
        run: mkdir -p tmp

      # Prepare DB schema (idempotent for SQLite in CI)
      - name: Prisma db push
        run: pnpm run db:push

      # - name: Seed
      #   run: pnpm run prisma:seed

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          start: pnpm dev
          wait-on: "http://localhost:3000"
          browser: electron
          spec: "cypress/e2e/**/*.cy.{ts,tsx,js,jsx}"

      # Upload videos/screenshots on failure
      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos

  docker:
    name: Docker (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [check, e2e]
    strategy:
      fail-fast: false
      matrix:
        target: [runner, migrator]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.name }}:${{ matrix.target }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_CLIENTVAR=clientvar
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - sts

  sts:
    image: ghcr.io/sts-cs-wpi/student-solver-tool:runner-${STS_IMAGE_TAG:?Set STS_IMAGE_TAG to the commit to deploy}
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      # production needs this path for db. it will override whatever is in the .env file.
      DATABASE_URL: "file:/data/prod.db"
    volumes:
      - sts_sqlite:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(() => process.exit(0)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  sts-migrate:
    image: ghcr.io/sts-cs-wpi/student-solver-tool:migrator-${STS_IMAGE_TAG:?Set STS_IMAGE_TAG to the commit to deploy}
    env_file:
      - .env
    volumes:
      - sts_sqlite:/data
    restart: "no"
    profiles: ["migrate"]

volumes:
  caddy_data:
  caddy_config:
  sts_sqlite:
    name: sts_sqlite
